[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nerve-agent-memory"
version = "0.8.0rc2"
description = "Offline MCP server for persistent AI coding-agent project memory and context recovery"
readme = "README.md"
keywords = ["ai agent memory", "persistent project context", "local MCP server", "coding assistant", "context drift", "multi-agent memory"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
cloud = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27"]

[project.scripts]
nerve = "nerve.cli:main"

[tool.setuptools.packages.find]
include = ["nerve*"]
