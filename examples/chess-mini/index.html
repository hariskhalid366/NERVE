<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Chess — NERVE test project</title><link rel="stylesheet" href="style.css"></head>
<body><main class="layout"><section><h1>Little Chess</h1><p class="sub">Local, dependency-free, two-player chess</p>
<div id="board" role="grid" aria-label="Chess board"></div></section>
<aside><div id="status" role="status" aria-live="polite"></div><div id="error" role="alert"></div>
<div class="actions"><button id="undo">Undo</button><button id="reset">New game</button><button id="claim" hidden>Claim draw</button></div>
<h2>Moves</h2><ol id="history" aria-label="Move history"></ol>
<p class="sub">Select a piece, then one of its highlighted destinations. Promotion can be selected when a pawn reaches the final rank.</p></aside></main>
<dialog id="promotion"><form method="dialog"><h2>Choose promotion</h2><div id="choices"></div><button value="cancel">Cancel</button></form></dialog>
<script type="module" src="app.mjs"></script></body></html>
