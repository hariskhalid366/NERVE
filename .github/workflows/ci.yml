name: NERVE tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test extras
        run: python -m pip install -e '.[cloud]'
      - name: Python regression tests
        env:
          NERVE_MCP_BACKEND: builtin
        run: python -m unittest discover -s tests -v
      - name: Second tiny project test
        run: python -m unittest discover -s examples/task-mini/tests -v
      - name: Offline release audit (short)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m benchmark.release_audit --quick --output benchmark/results/public-ci.json
  chess:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Chess engine rules
        run: node --test examples/chess-mini/tests/*.test.mjs
